# AI Vibe Coding Test - 프로덕션 배포용
# 배포 환경의 PostgreSQL 사용
# 사용법: docker-compose -f docker-compose.prod.yml up -d

services:
  # AI Worker (FastAPI + LangGraph)
  # BE compose가 제공하는 PostgreSQL/Redis에 연결
  ai_worker:
    image: ${DOCKERHUB_USERNAME}/vibecode-ai:latest
    container_name: ai_vibe_worker
    environment:
      - DEBUG=false
      - API_HOST=0.0.0.0
      - API_PORT=8000
      # 배포 환경 PostgreSQL 설정 (환경 변수 또는 .env.prod에서 설정)
      - POSTGRES_HOST=${POSTGRES_HOST:-vibecode_postgres}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_HOST=${REDIS_HOST:-vibecode-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - BE_BASE_URL=${BE_BASE_URL:-http://vibecode-app:8080}
      - SPRING_CALLBACK_URL=${SPRING_CALLBACK_URL}
      - JUDGE0_API_URL=${JUDGE0_API_URL}
      - JUDGE0_API_KEY=${JUDGE0_API_KEY}
      - JUDGE0_USE_RAPIDAPI=${JUDGE0_USE_RAPIDAPI:-false}
      - JUDGE0_RAPIDAPI_HOST=${JUDGE0_RAPIDAPI_HOST}
      - USE_REDIS_QUEUE=${USE_REDIS_QUEUE:-true}
      - ENABLE_JUDGE_WORKER=false
      - GOOGLE_SERVICE_ACCOUNT_JSON_PATH=${GOOGLE_SERVICE_ACCOUNT_JSON_PATH}
    volumes:
      - ./secrets/p-project-vertex_ex.json:/app/secrets/p-project-vertex_ex.json:ro
    ports:
      - "8001:8000"
    networks:
      - vibecode-net
    restart: unless-stopped

  # Judge0 Worker (코드 실행 Worker)
  judge_worker:
    image: ${DOCKERHUB_USERNAME}/vibecode-ai:latest
    container_name: ai_vibe_judge_worker
    environment:
      - REDIS_HOST=${REDIS_HOST:-vibecode-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JUDGE0_API_URL=${JUDGE0_API_URL}
      - JUDGE0_API_KEY=${JUDGE0_API_KEY}
      - JUDGE0_USE_RAPIDAPI=${JUDGE0_USE_RAPIDAPI:-false}
      - JUDGE0_RAPIDAPI_HOST=${JUDGE0_RAPIDAPI_HOST}
      - USE_REDIS_QUEUE=${USE_REDIS_QUEUE:-true}
    networks:
      - vibecode-net
    restart: unless-stopped
    command: python -m app.application.workers.judge_worker
    healthcheck:
      disable: true

networks:
  vibecode-net:
    name: vibecode-net
    external: true
