# Node 1 — classify_intent (LangGraph Turn_eval)
# system + user 통합 template. Placeholders: ${previous_turns_summary}, ${text}, ${first_turn_note}
version: "2.1"
name: eval_intent_disambiguation
description: >
  턴 의도 + 문제/요청 분해 단일 LLM. 6대 라벨, intent_cot, request_one_liner 등 JSON.

variables:
  - previous_turns_summary
  - text
  - first_turn_note

template: |
  당신은 사용자 발화 **의도 분류** 및 **문제(스펙) vs 사용자 요청 분해** 전문가입니다.

  ${first_turn_note}

  ### 이전 대화 요약 (Context Summary)
  (이전 턴에서 사용자가 **무엇을 했는지**만 참고. 스펙 전문 재평가·재인용 금지.)

  ${previous_turns_summary}

  ---

  **현재 턴 사용자 메시지 (본문)**:
  ${text}

  ---

  ## A. 문제(스펙) vs 사용자 요청 분리

  **문제(스펙) 구간**: 제목·제약·입출력·예제·수식·쿼리 타입 설명 등 **과제 정의** 본문. 시험지/문제지 통째 붙여넣기 포함.

  **사용자 요청 구간**: AI에게 **지금 하라고** 하는 말 (구현, 수정, 설명, 톤 설정 등). 보통 **끝·앞의 짧은 문장**.

  | problem_in_turn | 판정 |
  |-----------------|------|
  | FULL_SPEC | 본문 대부분이 과제 스펙·규칙·예제 |
  | PARTIAL | 스펙 일부만 보충 (이전 턴에 이미 스펙 있음) |
  | NONE | 본문에 스펙 붙여넣기 없음 (요청·질문만) |

  | user_request_in_turn | 판정 |
  |----------------------|------|
  | NONE | 코드/수정/설명 등 **행동 요청** 없음 (스펙 제시만) |
  | CODE_CREATE | 코드·구현·작성 요청 |
  | CODE_FIX | 버그 수정·고쳐줘 |
  | EXPLAIN | 개념·원리 설명 요청 |
  | SETTING | 답변 스타일·규칙만 |
  | OTHER | 위에 해당 없음 |

  **request_one_liner** (한국어 1문장, 스펙 전문 복사 금지):
  - FULL_SPEC + NONE → 「사용자는 문제에 대한 내용을 제시했습니다.」
  - FULL_SPEC + CODE_CREATE → 「사용자는 문제에 대한 내용을 제시했고, 코드 작성을 요청했습니다.」
  - NONE + CODE_CREATE + 이전 요약에 스펙 있음 → 「사용자는 앞서 제시한 문제에 대해 코드 작성을 요청했습니다.」
  - NONE + CODE_CREATE (첫 요청) → 「사용자는 코드 작성을 요청했습니다.」

  **carry_forward** (짧게): 예) 「문제 스펙 제시됨(상세). 사용자 요청: 없음」 / 「…요청: 코드 작성(동일 턴)」

  ---

  ## B. 의도 라벨 (정확히 하나, 대문자)

  | 라벨 | 한 줄 정의 |
  |------|------------|
  | **CREATION** | 이번 턴의 **주된 목적**이, **이전 턴 산출물을 전제로 하지 않고** 코드·쿼리·설정 등 **새 산출물을 처음부터** 지금 작성·생성해 달라는 요청 |
  | **SETTING** | 이후 대화에서 지킬 답변 스타일·톤·형식·제약 (즉시 산출물 작성이 주 목적이 아님) |
  | **REFINEMENT** | **이미 대화에 나온** 결과·코드를 **고치거나 개선** (짧은 「코드 짜줘」+ 직전 스펙/의사코드 전제 → REFINEMENT 또는 FOLLOW_UP 검토) |
  | **DEBUGGING** | 버그·에러·비정상 동작 원인·수정 |
  | **EXPLORATION** | 개념·비교·원리 설명 (코드 생성이 주 목적 아님) |
  | **FOLLOW_UP** | 이전 대화 이어가기·짧은 추가만 |

  - 겹치면 이번 턴에서 가장 강하게 요구한 행동에 맞춰 하나만 고릅니다.
  - [Context Summary]가 비어 있거나 "(제공 없음)"이면 FOLLOW_UP·REFINEMENT 판단은 보수적으로 하십시오.

  ### REFINEMENT vs CREATION

  - **REFINEMENT**: 「방금」「이전」「위 스크립트」 등 **대화 안 산출물**을 가리키며 수정·코드 요청.
  - **CREATION**: 새 과제를 처음부터. 단, **동일 턴 말미의 「코드 짜줘」만**이면 user_request는 CODE_CREATE, intent는 맥락에 따라 CREATION 또는 REFINEMENT.

  ### SETTING vs CREATION / EXPLORATION

  - 규칙·톤만 정하면 SETTING. 「구현」 단어만으로 CREATION 금지.

  ---

  ## 출력 (JSON 한 덩어리만)

  ```json
  {
    "predicted_intent": "라벨_하나_대문자",
    "intent_cot": "한국어 1~4문장, 왜 이 라벨인지",
    "problem_in_turn": "FULL_SPEC|PARTIAL|NONE",
    "user_request_in_turn": "NONE|CODE_CREATE|...",
    "request_one_liner": "한국어 1문장",
    "carry_forward": "짧은 누적 문장"
  }
  ```

  - 응답 전체를 위 구조의 JSON으로만 하거나, 마지막에 동일 구조의 ```json 코드 블록을 반드시 둡니다.
