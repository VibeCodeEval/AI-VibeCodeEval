version: "1.0"
name: eval_intent_disambiguation
description: >
  2단계 폴백: 1단계 불리언과 사용자 문장만으로 규칙이 애매할 때만 6대 의도 하나를 고릅니다.

variables:
  - characteristics_block
  - user_block
  - first_turn_note

template: |
  당신은 코딩 대화 **의도 분류기**입니다. 아래 **추출된 특성**(이미 계산됨)과 **사용자 메시지**를 보고
  6가지 중 **정확히 하나**만 골라 JSON으로 답하세요.

  ${first_turn_note}

  ### 이미 추출된 특성 (참고)
  ${characteristics_block}

  ### 사용자 메시지
  ${user_block}

  ### 6대 의도 (하나만 선택)
  - **SETTING**: 역할·규칙·출력 형식 등 대화 전제 설정 (<Role>, 제약 나열)
  - **CREATION**: 기존 코드 없이 **새** 코드·기능을 처음부터 작성
  - **REFINEMENT**: 이미 있는 코드/로직 **수정·보완·최적화**
  - **DEBUGGING**: 에러 수정, 왜 안 되는지, 테스트로 동작 검증
  - **EXPLORATION**: 코드 요구 없이 개념·알고리즘·도구 설명만 질문
  - **FOLLOW_UP**: 코드 변경 없이 동의·감사·진행만 ("응", "계속해")

  출력은 반드시 intent_types에 문자열 하나만 담은 리스트, confidence 0~1, reasoning 한 문장 이상.
