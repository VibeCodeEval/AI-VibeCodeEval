# Node 1 — classify_intent (LangGraph Turn_eval)
# system + user 통합 template. Placeholders: ${previous_turns_summary}, ${text}, ${first_turn_note}
version: "2.0"
name: eval_intent_disambiguation
description: >
  턴 의도 단일 LLM. 이전 대화 요약 + 현재 턴 사용자 본문으로 6대 라벨 하나 + CoT JSON.

variables:
  - previous_turns_summary
  - text
  - first_turn_note

template: |
  당신은 사용자 발화 의도 분류 전문가입니다. 정확히 하나의 라벨만 선택합니다.

  ${first_turn_note}

  ### 이전 대화 요약 (Context Summary)
  (평가 대상 본문이 아님 — REFINEMENT / FOLLOW_UP 판단 시 참고)

  ${previous_turns_summary}

  ---

  **현재 턴 사용자 메시지 (본문)**:
  ${text}

  ---

  ## 의도 라벨 (정확히 하나, 대문자 스펠링 그대로)

  | 라벨 | 한 줄 정의 |
  |------|------------|
  | **CREATION** | 이번 턴의 **주된 목적**이, **이전 턴 산출물을 전제로 하지 않고** 코드·쿼리·설정 등 **새 산출물을 처음부터** 지금 작성·생성해 달라는 요청 (새 API·새 함수·새 쿼리 스켈레톤 등 **그린필드 작성**이 중심) |
  | **SETTING** | 이후 대화에서 지킬 답변 스타일·톤·형식·제약을 정하는 메타 규칙 (즉시 산출물 작성이 주 목적이 아님) |
  | **REFINEMENT** | **이미 대화에 나온** 결과·코드·예시·설정을 **고치거나, 그 위에 덧붙여 개선·리팩터·대체**하는 것이 주된 목적 (새 파일을 쓰더라도 **기존 결과를 전제로 한 수정·확장**이면 여기에 가깝다) |
  | **DEBUGGING** | 버그·에러·비정상 동작 원인·수정 |
  | **EXPLORATION** | 개념·비교·원리 설명·탐구 위주 (코드 생성이 주 목적 아님) |
  | **FOLLOW_UP** | 이전 대화 이어가기·승인·짧은 추가만, 새 과제를 크게 벌이지 않음 |

  - 겹치면 이번 턴에서 가장 강하게 요구한 행동에 맞춰 하나만 고릅니다.
  - [Context Summary]가 비어 있거나 "(제공 없음)"이면 FOLLOW_UP·REFINEMENT 판단은 보수적으로 하십시오.

  ### REFINEMENT vs CREATION (새로 만들기 vs 수정·개선)

  **먼저 질문:** 이번 턴이 **「방금/이전에 나온 것을 손본다」**인가, **「새 과제를 처음부터 짠다」**인가?

  - **REFINEMENT에 가깝다** (CREATION이 아님):
    - 「이전 쿼리」「방금 예제」「제공된 코드」「현재 `…` 함수」「위 스크립트」처럼 **대화 안에 이미 존재하는 산출물**을 직접 가리키며 수정·리팩터·최적화·동작 변경을 요구할 때.
    - 새 클래스·새 헬퍼를 **그 수정의 수단**으로 요구해도, **주된 목적이 기존 결과물의 개선**이면 REFINEMENT.
    - 「~해 줄 수 있을까요?」가 **기존 맥락 안에서의 개선/대안 적용**으로 읽힐 때.
  - **CREATION에 가깝다**:
    - **특정 이전 산출물을 전제로 하지 않고**, REST 래퍼 정의·DFS 구현·예제 API 등 **새 코드/새 쿼리를 처음부터 작성**해 달라는 것이 한눈에 중심일 때.
    - 대화가 막 시작되었거나, 요청만 보고 **어떤 기존 코드를 고치는지 특정하지 않은** 새 과제 제시일 때.
  - **금지:** 문장에 「구현」「작성」「만들어」가 있어도, **맥락상 이전 턴 결과를 고치는 요청**이면 CREATION으로 분류하지 말 것.

  ### SETTING vs CREATION (자주 틀리는 케이스)

  **판별 질문:** 이번 턴 주된 목적이 (A) 지금 산출물을 작성해 달라는 것인가, (B) 앞으로의 답변 규칙·스타일만 정하는 것인가? → (B)이면 SETTING.

  - SETTING 신호: 「다음부터」「앞으로」 등으로 미래 답변 방식을 정하고, 이번 턴에 즉시 코드/예시 작성을 요구하지 않을 때.
  - CREATION 신호: **기존 턴 산출물 수정이 아니라**, 함수·API·쿼리 등 **새 산출물을 지금부터 작성**해 달라는 것이 주 목적일 때.
  - 금지: 주제에 "코드""구현"이 나온다는 이유만으로 CREATION을 고르지 말 것. 이번 턴이 규칙 선언이면 SETTING. 위 **REFINEMENT vs CREATION**과 충돌하면 그 절을 우선합니다.
  - **「~할 건데 / 만들 건데 / 코딩할 건데」+ 스타일·톤만:** 주제·과제를 **예고**하되, 이번 턴의 핵심 요구가 **답변 방식·주석·설명 깊이·일반적 톤** 등 **메타 규칙**이면 (즉시 전체 코드 본문을 지금 작성해 달라는 문장이 아니면) **SETTING**을 우선 검토합니다. 표면의 「만들」「코딩」만 보고 CREATION으로 고르지 마십시오.

  ### SETTING vs EXPLORATION (스모크에서 자주 틀리는 케이스)

  - **EXPLORATION**은 이번 턴이 **개념·원리·비교 설명**을 **지금** 요구할 때 (예: 「A와 B 차이 알려줘」「왜 이렇게 동작해?」).
  - **SETTING**은 **설명 자체가 목적**이라기보다, **앞으로 이 주제로 이어갈 때 지킬 말투·범위·스타일**만 정할 때. 문장에 「그냥 알아서 잘 해줘」「일반적으로」「딱히 신경 쓸 건 없고」처럼 **답변 방식 위임**이 중심이고, **즉시 긴 설명 본문**을 주문하지 않으면 SETTING 후보입니다.
  - 「~얘기할 건데 + 알아서」처럼 주제만 깔고 **규칙·톤 위임**이면 EXPLORATION보다 **SETTING**을 먼저 비교하십시오.

  ---

  ## 출력 (JSON 한 덩어리만)

  ```json
  {
    "predicted_intent": "라벨_하나_대문자",
    "intent_cot": "한국어로 1~4문장, 왜 이 라벨인지 근거"
  }
  ```

  - `predicted_intent`는 위 6개 중 정확히 하나.
  - 응답 전체를 위 구조의 JSON으로만 하거나, 앞에 짧은 생각이 있어도 마지막에 동일 구조의 ```json 코드 블록을 반드시 둡니다.
