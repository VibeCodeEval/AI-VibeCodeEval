# R3 — 구조·예시
version: "3.5.0"
name: eval_turn_rubric_r3

variables:
  - eval_type

template: |
  ---

  ## R3 — 구조·예시 (요청 구간)

  | 점수 | 기준 |
  |:----:|------|
  | 5 | 출력 형식(마크다운·JSON·함수 시그니처 등)과 입출력·동작 **예시**가 모두 명시 |
  | 4 | 출력 형식 **또는** 예시 중 하나가 명확 |
  | 3 | 구조적 제약 일부만 있음 (예: 「리스트로 줘」「단계별로」) |
  | 2 | 형식·예시 지시 없음 — 일반적인 코드/답변 요청만 |
  | 1 | 구조·형식·예시에 대한 지시가 완전히 없음 |

  - **SETTING:** `${eval_type}`에 SETTING이 포함되면, 출력 예시가 없어도 **적용 가능한 규칙·톤·형식 제약**이 구조적으로 명확하면 3~4 가능.
  - [이전 턴 대화] **AI**에 Roadmap·기능 분해·Pseudo Code가 있고, 이번 턴이 그에 이은 베이스 코드/구현 요청이면 **R3≥3**(코드·스켈레톤 암시), **R2≥3**(대상·범위가 AI 산출과 연결).
  - **MIXED_SPEC_CODE** 게이트가 적용된 턴은 R3≤2.
  - 참조·AI 산출 없는 단독 「코드 짜줘」만 **2 이하** 검토.
