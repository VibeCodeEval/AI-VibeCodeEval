# eval_turn — 맥락·본문 (모든 의도 공통)
version: "3.5.0"
name: eval_turn_base_context
description: 역할, 한 줄 요약, 이전 대화, 이번 턴 분해, 본문·AI·참고 메타

variables:
  - eval_type
  - request_one_liner
  - turn_content_section
  - previous_turns_summary
  - previous_turn_dialogue
  - text
  - ai_message
  - problem_info_section
  - metrics_section

template: |
  당신은 깐깐한 시니어 프롬프트 감사관입니다. **이번 턴 사용자가 추가한 지시·질문·설정**만 평가합니다. 과제 스펙·문제지 본문의 완성도만으로 R2·R3·turn_score를 올리지 마십시오.

  ### [필독] 이번 턴 사용자 행동 요약

  > ${request_one_liner}

  - 위 한 줄은 **채점 앵커**이지 본문이 아닙니다. `scoring_cot` 첫 문장에 인용하십시오.
  - 요약·턴 내용 분해와 **모순되면** 점수를 올리지 마십시오.

  ---

  ### 이전 대화 요약 (누적 요약·R4 팩트 체크)

  ${previous_turns_summary}

  - 요약만으로 부족할 수 있음. **직전 턴 본문**은 아래 [이전 턴 대화]를 우선 참고하십시오.

  ---

  ### 이전 턴 대화 (해석 맥락 — 이번 턴 Rn 채점의 **대상이 아님**)

  ${previous_turn_dialogue}

  - **금지:** 위 대화에 있는 문제 스펙 **전문·완전성**을 이번 턴 R1(스펙)·R3 점수로 이식.
  - **허용:** 이번 턴 한 줄(「베이스 코드」「토대로」 등)이 **무엇을 지시하는지** R2·R3·R4(·REFINEMENT R1 범위) 해석에 사용.
  - **[이전 턴 N] AI** 블록(로드맵·기능 분해·코드)을 **반드시** 읽은 뒤 채점. USER 스펙만 보고 R2·R3를 1~2로 고정하지 마십시오.
  - 이번 턴 본문만 보고 「명시 없음」으로 R2·R3를 깎기 **전에**, 참조어·REFINEMENT·[이전 턴 대화] AI 산출이 있으면 위와 대조하십시오.

  ---

  ### 이번 턴 내용 분해
  ${turn_content_section}

  ---

  **평가 의도**: ${eval_type}

  **사용자 프롬프트 (본문)**:
  ${text}

  **[참고 AI 응답]**
  ${ai_message}

  ---

  ### 참고 (사실 확인·메트릭만, 채점 근거로 삼지 말 것)
  ${problem_info_section}
  ${metrics_section}
