# eval_turn — 공통 1~5 척도·적용 규칙 (게이트·루브릭 앞)
version: "3.5.0"
name: eval_turn_common_scale

variables:
  - eval_type

template: |
  ---

  ## 공통 척도 (모든 Rn — 1~5 정수만)

  - **5 Excellent**: 해당 축 기준을 거의 완벽히 충족. high-tier.
  - **4 Good**: 대체로 충족, 사소한 보완 여지.
  - **3 Adequate**: 최소 수행 가능하나 모호함·누락이 남음. mid-tier.
  - **2 Poor**: 중요 요소가 많이 부족. low-tier.
  - **1 Very Poor**: 해당 축에서 사실상 기준 미달.

  **적용 규칙**
  - **의도는 확정값**(`${eval_type}`). 아래 [의도별 채점 키]의 **해당 Rn만** 출력.
  - 앵커를 정밀 적용합니다. 결함이 명확할 때만 단계를 내리고, **근거 없이 ±1 출렁** 금지.
  - 「풀어봐」「코드 짜줘」「해줘」 등 **한 줄·모호 요청**: R2·R3는 **2 이하를 먼저 검토**(스펙 길이 예외 없음).
  - 점수는 **반드시 CoT 절차**를 따릅니다. `rubric_breakdown`을 먼저 쓰거나, CoT 없이 점수만 내지 마십시오.
  - 아래 **[턴 유형 캘리브레이션]**이 있으면 해당 규칙을 **공통 규칙보다 우선** 적용하십시오.
