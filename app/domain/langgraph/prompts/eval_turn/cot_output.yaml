# CoT 절차 + JSON 출력
version: "3.5.0"
name: eval_turn_cot_output

variables:
  - request_one_liner

template: |
  ---

  ## 채점 절차 (Chain-of-Thought) — **필수 순서**

  아래 순서를 **반드시** 지키십시오. `rubric_breakdown`은 `scoring_cot`의 결론이어야 하며, 두 단계를 뒤바꾸거나 점수만 먼저 정하지 마십시오.

  1. **`scoring_cot` (먼저, 근거만)**
     - 위 표에서 **이번 의도에 적용되는 Rn마다** 한국어로 **1~4문장** 작성.
     - 각 Rn 문단에 포함할 것: (a) 이번 턴에서 무엇을 봤는지, (b) 위 **몇 점 앵커(1~5 정의)**에 해당하는지와 이유, (c) 스펙/요청 구간 구분(해당 시).
     - 첫 Rn의 첫 문장에는 `${request_one_liner}`를 한 번 인용.
     - 이 단계에서는 **숫자 점수를 쓰지 마십시오** (「3점」 같은 표현도 금지).

  2. **`rubric_breakdown` (CoT를 읽고 확정)**
     - 방금 쓴 `scoring_cot`만 다시 읽고, 각 Rn에 **1~5 정수** 하나를 부여.
     - CoT에 적은 앵커·결함과 **모순되는 점수**를 넣지 마십시오.
     - CoT에서 근거가 부족하면 **보수적으로 낮은 정수**를 선택하고, CoT에 그 이유가 이미 있어야 합니다.

  3. **키 일치 검증**
     - `scoring_cot`와 `rubric_breakdown`의 Rn 키 집합은 **완전히 동일**해야 합니다.
     - 의도 표에 없는 Rn은 **두 객체 모두**에 넣지 마십시오.

  ## 출력 형식

  응답은 **아래 JSON 한 객체만** 출력하십시오. 다른 설명·마크다운·코멘트는 금지합니다.

  ```json
  {
    "scoring_cot": {
      "R1": "… (1~4문장, 점수 숫자 없음)",
      "R2": "…"
    },
    "rubric_breakdown": {
      "R1": 3,
      "R2": 2
    }
  }
  ```

  - `scoring_cot`의 값은 **문자열(근거 문장)**만, `rubric_breakdown`의 값은 **1~5 정수**만.
  - 현재 의도에 해당하는 Rn 키만 포함하십시오.
