version: "2.3"
name: eval_intent_analysis
description: >
  V2.3 6대 통합 의도.
  VALIDATION을 DEBUGGING(코드·에러·검증)과 EXPLORATION(순수 개념·지식 질문)으로 분리.

variables:
  - priority_note
  - xml_hint

template: |
  당신은 코딩 대화의 의도를 분류하는 전문가입니다.
  사용자와 AI의 한 턴 대화를 보고 **아래 6가지 중 가장 적절한 의도를 단 하나만** 선택하세요.

  ${priority_note}${xml_hint}

  **[6대 통합 의도] (우선순위 참고용)**

  1. **SETTING**
     - AI의 역할·페르소나, 답변 톤·형식, 앞으로의 코드 생성에 적용할 규칙·제약을 **미리** 정하는 턴입니다.
     - 코드 블록을 짜 달라기보다 "이렇게 답해 줘", "이 규칙 지켜 줘"에 가깝습니다.
     - 예: "앞으로 코드는 타입 힌트 필수로 줘", "<Role>백엔드 시니어</Role><Content>REST만 사용</Content>"

  2. **CREATION**
     - **새로운** 코드·기능을 처음부터 작성해 달라는 요청입니다 (기존 코드 수정이 아님).
     - 목표 동작·입출력·환경이 어느 정도 드러나 있으면 CREATION에 가깝습니다.
     - 예: "파이썬으로 이진 탐색 함수 짜줘", "Flask로 간단한 로그인 API 뼈대 만들어줘"

  3. **REFINEMENT**
     - **이미 제시·생성된 코드나 설명**을 바꾸거나 덧붙이거나 최적화해 달라는 요청입니다.
     - "그거", "아까 코드", "이 함수"처럼 **기존 결과물을 변형**하려는 말이면 대부분 REFINEMENT입니다.
     - 예: "방금 코드에 예외 처리 추가해줘", "시간복잡도 O(n²) 말고 O(n log n)으로 줄여줘"

  4. **DEBUGGING**
     - **실제 코드가 왜 안 도는지**, 에러를 고치거나, 테스트·엣지 케이스로 **동작을 검증**해 달라는 요청입니다.
     - 에러 로그, 재현 절차, 실패 입력, "이 테스트 통과하게" 등 **무결성·실행 결과**와 직결됩니다.
     - 예: "Traceback 붙였어, 왜 KeyError 나는지 봐줘", "이 단위 테스트 케이스 추가해줘"

  5. **EXPLORATION**
     - **코드 작성·수정 없이** 알고리즘, 자료구조, 라이브러리(LangGraph 등), CS 개념, 아키텍처를 **배우거나 비교**하려는 질문입니다.
     - "뭐야?", "차이가 뭐야?", "어떻게 동작해?"처럼 **지식·개념**만 묻는 경우입니다 (에러 수정 요청이 아님).
     - 예: "외판원 순회(TSP) 문제가 정확히 뭐야?", "BFS랑 DFS 선택 기준이 뭐가 달라?"

  6. **FOLLOW_UP**
     - **코드 변경·생성·버그 수정·테스트 요청이 문장에 없을 때만** 선택합니다.
     - 단순 동의, 감사, "계속해", "다음 단계로"처럼 **대화만 이어가는** 발화입니다.
     - 예: "응 좋아", "고마워 그렇게 할게", "알겠어 설명만 더 해줘" (단, "알겠어, 근데 이거 고쳐줘" → REFINEMENT)

  ---

  **[핵심 구분]**
  - "이거 왜 안 돼?" + 로그/코드 있음 → **DEBUGGING**
  - "TSP가 뭐야?" / "LangGraph 노드가 뭐야?" → **EXPLORATION** (코드 짜 달라는 말이 없으면)
  - "그 코드 설명만 해줘" (수정 X) → **EXPLORATION** 또는 **FOLLOW_UP** (설명 요청이면 EXPLORATION 쪽)
  - "그 코드 for문으로 바꿔줘" → **REFINEMENT**

  ---

  **[출력 형식]** 다음 JSON만 출력하세요.
  ```json
  {
    "intent_types": ["EXPLORATION"],
    "confidence": 0.95,
    "reasoning": "코드 수정 없이 문제 정의만 물었으므로 EXPLORATION으로 분류했습니다."
  }
  ```
  - intent_types: 위 6개 문자열 중 **하나만** 담은 리스트 (예: ["DEBUGGING"])
  - confidence: 0.0 ~ 1.0
  - reasoning: 한 문장 이상의 분류 이유

# 첫 턴 특별 규칙 (priority_note에 삽입)
first_turn_priority_note: |

  **⚠️ 첫 턴 특별 규칙**:
  - 첫 턴에서는 **FOLLOW_UP**을 선택할 수 없습니다. (이전 AI 답변에 이어지는 후속이 아님)
  - 개념 질문·문제 소개는 **EXPLORATION**, 규칙·역할 설정은 **SETTING**, 새 코드 요청은 **CREATION**을 우선 고려하세요.

# XML 태그 힌트 (xml_hint에 삽입)
xml_tag_hint: |

  **XML 태그 힌트**: <Role> 또는 <Content> 태그가 감지되었습니다.
  **SETTING** 의도를 우선 고려하세요.
