version: "2.3"
name: eval_holistic_flow
description: >
  V2.3 Holistic Flow 평가 (Strict Integer 1-5).
  모든 점수는 정수(Integer)로만 출력하며,
  평균 계산은 외부(Python)에 위임하여 LLM의 연산 오류를 방지함.

variables:
  - problem_info_section
  - algorithms_text
  - hint_roadmap_section

template: |
  당신은 AI 코딩 테스트의 **사용자 프롬프트 Chaining 전략**을 평가하는 전문가입니다.
  다음 대화 로그를 분석하여, 각 항목을 **1(나쁨) ~ 5(최우수)의 정수(Integer)**로 평가하세요.

  ${problem_info_section}

  다음은 사용자의 턴별 대화 로그입니다. **사용자 프롬프트의 Chaining 전략만 평가**하세요. AI 응답(ai_summary)은 참고용이며, 점수 평가에는 영향을 주지 마세요.
  문제 특성(${algorithms_text}) 및 힌트 로드맵을 참고할 수 있습니다.${hint_roadmap_section}

  ---

  ### 🚨 핵심 평가 철학: "위임(Delegation)도 전략이다"

  - **상황**: 사용자가 초반에 명확한 규칙(Setting)을 세워두고, 이후에는 짧은 승인("응, 진행해", "다음")만으로 결과를 만들어내는 경우.
  - **판정**: 이는 '수동적 태도(3)'가 아니라 **'고도의 관리 전략(5)'**입니다.
  - **주의**: 초반 설계 없이 무작정 "알아서 해줘"라고 하는 것은 1~2점입니다.

  ---

  ### 1. 평가 항목 및 5점 정수 척도 (Integer Scale)

  #### A. 문제 분해 (Problem Decomposition)
  - **1**: 한 번에 "전체 코드 다 짜줘" (분해 없음).
  - **3**: "기능 구현해줘", "테스트해줘" 정도로 단순하게 나눔.
  - **5**: "뼈대(Skeleton) -> 핵심 로직 -> 예외 처리 -> 테스트" 순으로 치밀하게 단계를 설계함.

  #### B. 피드백 수용성 (Feedback Integration)
  - **1**: AI의 힌트나 에러를 무시하고 같은 말만 반복함.
  - **3**: 에러가 나면 "에러 고쳐줘"라고 반응함 (수동적 수용).
  - **5**: 에러 로그나 힌트를 분석하여 "이 부분 로직이 틀린 것 같으니 B 방식으로 수정해줘"라고 구체적으로 역제안함.

  #### C. 전략적 탐색 및 관리 (Strategic Exploration & Management)
  - **1**: 주도권 없이 AI에게 끌려다님 ("그다음은?", "뭐 해야 해?").
  - **3**: 무난하게 대화를 이어감 ("응 진행해", "좋아").
  - **5**:
    - **의도 전환**: 디버깅하다가 테스트 케이스 작성으로 넘어가는 등 판단이 빠름.
    - **위임 전략**: 초반 Rule Setting 덕분에, 이후 짧은 지시만으로도 완벽하게 통제함.
    - **고급 기법**: XML 태그, System Prompt 사용 시 5점 부여.

  #### D. 종합 점수 (Overall Flow Score)
  - 위 항목들을 종합한 당신의 **직관적인 총평**입니다.
  - 반드시 **정수(1, 2, 3, 4, 5)**로만 출력하세요. (소수점 금지)

  ---

  ### 2. 응답 형식 (JSON)
  **모든 점수 값은 반드시 정수(Integer) 1~5 여야 합니다.**

  ```json
  {
      "problem_decomposition": 1,
      "feedback_integration": 1,
      "strategic_exploration": 1,
      "overall_flow_score": 1,
      "analysis": "상세 분석 내용 (markdown). 점수의 이유와 위임 전략/고급 기법 사용 여부를 명시하세요."
  }
  ```

  - `problem_decomposition`: 항목 A (1~5 정수)
  - `feedback_integration`: 항목 B (1~5 정수)
  - `strategic_exploration`: 항목 C (1~5 정수)
  - `overall_flow_score`: 항목 D 종합 인상 (1~5 정수). 외부에서 0~100으로 환산합니다.
  - `analysis`: 상세 분석 (주도성·오류 수정, 고급 기법, 위임 전략 포함). AI 응답 품질은 평가하지 마세요.
