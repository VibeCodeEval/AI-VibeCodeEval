version: "2.0"
name: summary
description: 이전 요약 + 최신 턴(human/ai) 기반 갱신 요약 프롬프트

variables:
  - prev_summary
  - latest_turn

system: "당신은 대화 요약 전문가입니다. 핵심만 남긴 갱신 요약 1개를 만듭니다."

template: |
  아래는 **이전까지의 대화 요약**과 **최근 턴(사용자+어시스턴트)**입니다.
  이전 요약을 바탕으로 최근 턴을 반영해, **갱신 요약 1개**로 다시 작성하십시오.

  ### 규칙
  - 한국어로 작성.
  - 출력은 아래 2줄 형식의 **단일 요약 블록**만 사용 (머리말/불릿/번호 금지):
    - `human: ...`
    - `ai: ...`
  - `human`에는 사용자의 **기술 스택/주제 + 요구사항/제약**만 압축해 기록.
  - `ai`에는 어시스턴트가 구현/작성한 내용을 **핵심 구현 포인트 중심으로 구체적으로** 기록.
    - 포함 권장: 어떤 컴포넌트/함수/로직을 추가·수정했는지, 분기/검증/에러 처리/데이터 흐름에서 무엇이 달라졌는지
  - 마지막 응답이 질문이라면, "질문함"으로 끝내지 말고 **질문 핵심을 구체적으로** 요약.
    - 나쁨: "다음 스텝을 질문함"
    - 좋음: "다음 스텝으로 에러 응답 스키마에 `error_code`를 포함할지 질문함"
    - 예: "A 방식 구현함", "B 기능 코드 초안 작성함", "입력 검증과 에러 분기 로직을 추가하고 테스트 범위를 단위 테스트까지 확장할지 질문함"
  - 변수명/함수명/에러메시지는 **후속 판단에 꼭 필요한 경우에만** 짧게 포함.
  - 장황한 배경 설명, 코드 본문, 예시 전문은 제거.
  - 길이 가이드: 기본 500자 내 목표.
  ---

  ### 이전 대화 요약
  ${prev_summary}

  ### 최근 턴
  ${latest_turn}

  ---

  ### 출력 예시
  human: 사용자가 TypeScript 제네릭 기반 API 응답 래퍼 구현을 요청했고, 범용성·주석 품질을 제약으로 제시함.
  ai: API 응답 래퍼 핵심 기능(응답 래핑, 에러 분기)을 구현했고, 다음 스텝으로 에러 응답 스키마에 `error_code`를 포함할지 질문함.

  ---

  위 내용을 통합한 **갱신 요약 1개(2줄)**만 출력하십시오. (JSON 금지)
